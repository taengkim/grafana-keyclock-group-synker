apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-team-sync
  labels:
    app.kubernetes.io/name: grafana-team-sync
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Kill a hung run well before the next schedule fires
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-team-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              # Replace with your registry
              image: registry.example.com/grafana-team-sync:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: KEYCLOAK_URL
                  value: "https://keycloak.example.com"
                - name: KEYCLOAK_REALM
                  value: "my-realm"
                - name: KEYCLOAK_CLIENT_ID
                  value: "grafana-team-sync"
                - name: KEYCLOAK_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-team-sync
                      key: KEYCLOAK_CLIENT_SECRET
                - name: GRAFANA_URL
                  value: "https://grafana.example.com"
                - name: GRAFANA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-team-sync
                      key: GRAFANA_TOKEN
                - name: GROUP_PREFIX
                  value: "grafana-"
                - name: MATCH_KEY
                  value: "email"
                # Permission-group suffix -> team permission mapping.
                # Omit to use the built-in defaults (adm/admin -> Admin,
                # member/mbr/mem -> Member).
                - name: PERMISSION_MAP
                  value: "adm=admin,member=member"
                # DRY_RUN defaults to true in the script; production must opt in
                # explicitly. Flip to "true" here to preview changes safely.
                - name: DRY_RUN
                  value: "false"
                - name: MAX_REMOVAL_RATIO
                  value: "0.5"
                - name: LOG_LEVEL
                  value: "INFO"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
